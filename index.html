<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delicate Pão de Mel</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ef6f87, #f48ca0);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 850px;
        }

        .logo {
        width: 100%;
        max-width: 430px;
        height: auto;
        margin: 0 auto 40px;
        display: block;
        }
        h1 {
            font-family: Georgia, "Times New Roman", serif;
            font-size: 52px;
            font-weight: normal;
            letter-spacing: 4px;
            margin-bottom: 10px;
        }

        .subtitulo {
            font-size: 20px;
            letter-spacing: 8px;
            text-transform: uppercase;
            margin-bottom: 45px;
        }

        .linha {
            width: 80px;
            height: 2px;
            background: white;
            margin: 0 auto 35px;
            opacity: 0.8;
        }

        h2 {
            font-size: 28px;
            margin-bottom: 18px;
            font-weight: 500;
        }

        p {
            font-size: 18px;
            line-height: 1.7;
            max-width: 620px;
            margin: 0 auto;
        }

        .destaque {
            margin-top: 35px;
            padding: 14px 28px;
            display: inline-block;
            border: 1px solid rgba(255,255,255,0.7);
            border-radius: 40px;
            font-size: 15px;
            letter-spacing: 2px;
        }

        footer {
            margin-top: 60px;
            font-size: 13px;
            opacity: 0.8;
        }

        .contatos {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 18px;
            flex-wrap: wrap;
            font-size: 15px;
        }

        .contatos a {
            color: white;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .contatos a:hover {
            opacity: 0.7;
            text-decoration: underline;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 36px;
            }

            .subtitulo {
                font-size: 15px;
                letter-spacing: 5px;
            }

            h2 {
                font-size: 23px;
            }

            p {
                font-size: 16px;
            }

            .logo {
                max-width: 280px;
            }
        }
    </style>
</head>

<body>

    <main class="container">

        <img
            src="Logo_Delicate.png"
            alt="Delicate Pão de Mel"
            class="logo"
        >

        <div class="linha"></div>

        <h2>Um doce feito para momentos especiais.</h2>

        <p>
            Estamos preparando um espaço especial para apresentar
            nossos produtos, sabores e novidades.
        </p>

        <div class="destaque">
            EM BREVE, NOSSO NOVO SITE
        </div>
        
        <div class="contatos">
            <a href="https://wa.me/5541999246080" target="_blank">
                WhatsApp: (41) 99924-6080
        </a>

    <span>•</span>

    <a href="https://www.instagram.com/delicate.doces/" target="_blank">
        Instagram: @delicate.doces
    </a>
</div>
        <footer>
            © 2026 Delicate Pão de Mel
        </footer>

    </main>

</body>
</html>
